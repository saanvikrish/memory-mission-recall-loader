<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Mission Loading Screen</title>
  <style>
    :root {
      --bg: #070b10;
      --panel: #0d131a;
      --panel-2: #111a23;
      --line: rgba(132, 154, 177, 0.2);
      --text: #eef4fb;
      --muted: #9aa6b2;
      --quiet: #65717f;
      --blue: #88cdf8;
      --blue-soft: rgba(136, 205, 248, 0.15);
      --card: #e8f1f8;
      --card-back: #121d27;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 46%, rgba(136, 205, 248, 0.1), transparent 25rem),
        linear-gradient(135deg, #081018 0%, #070b10 55%, #040609 100%);
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .screen {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px 76px;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.055;
      background-image:
        linear-gradient(rgba(140, 160, 180, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 160, 180, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 0 38%, transparent 74%);
      pointer-events: none;
    }

    .loader {
      position: relative;
      z-index: 2;
      width: min(520px, 92vw);
      text-align: center;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      color: var(--quiet);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .path {
      color: var(--blue);
      letter-spacing: 0.06em;
    }

    .panel {
      position: relative;
      padding: 32px 30px 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 36%),
        rgba(13, 19, 26, 0.9);
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(18px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(132, 154, 177, 0.08);
      border-radius: 20px;
      pointer-events: none;
    }

    .cards {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      border: 1px solid rgba(136, 205, 248, 0.18);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(17, 26, 35, 0.95), rgba(8, 13, 19, 0.82));
      overflow: hidden;
    }

    .cards::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(136, 205, 248, 0.22), transparent);
      transform: translateY(-50%);
    }

    .card {
      position: relative;
      width: 66px;
      height: 84px;
      perspective: 900px;
    }

    .inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: flip 7.8s infinite cubic-bezier(0.2, 0.72, 0.18, 1);
      animation-delay: var(--delay);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      backface-visibility: hidden;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.26);
    }

    .front {
      border: 1px solid rgba(238, 244, 251, 0.58);
      background: linear-gradient(180deg, var(--card), #d8e5ee);
    }

    .back {
      border: 1px solid rgba(136, 205, 248, 0.22);
      background: linear-gradient(180deg, #15212c, var(--card-back));
      transform: rotateY(180deg);
    }

    .back::after {
      content: "";
      width: 24px;
      height: 24px;
      border: 1px solid rgba(136, 205, 248, 0.38);
      border-radius: 8px;
      transform: rotate(45deg);
    }

    .shape {
      width: 25px;
      height: 25px;
      background: var(--blue);
      filter: drop-shadow(0 0 8px rgba(136, 205, 248, 0.35));
    }

    .circle { border-radius: 999px; }
    .square { border-radius: 7px; }
    .triangle {
      width: 0;
      height: 0;
      background: transparent;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 27px solid var(--blue);
    }
    .star {
      clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
    }

    .status {
      margin-top: 24px;
    }

    .status h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 620;
      letter-spacing: -0.025em;
    }

    .status p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-wrap {
      margin-top: 24px;
      padding: 14px 16px 16px;
      border: 1px solid rgba(132, 154, 177, 0.18);
      border-radius: 15px;
      background: rgba(3, 7, 11, 0.5);
      text-align: left;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--muted);
      font-family: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .percent::before {
      content: "0%";
      color: var(--blue);
      animation: percentText 7.8s infinite steps(4, end);
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37, 51, 66, 0.88);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #c7e9ff);
      box-shadow: 0 0 18px rgba(136, 205, 248, 0.24);
      animation: fillProgress 7.8s infinite cubic-bezier(0.2, 0.72, 0.18, 1);
    }

    .caption {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 28px;
      width: min(620px, calc(100vw - 48px));
      transform: translateX(-50%);
      color: rgba(154, 166, 178, 0.72);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    @keyframes flip {
      0%, 14% { transform: rotateY(180deg) translateY(0); }
      23%, 62% { transform: rotateY(0deg) translateY(-2px); }
      72%, 100% { transform: rotateY(180deg) translateY(0); }
    }

    @keyframes fillProgress {
      0%, 8% { width: 0%; }
      28% { width: 25%; }
      48% { width: 50%; }
      68% { width: 75%; }
      86%, 100% { width: 100%; }
    }

    @keyframes percentText {
      0%, 24% { content: "0%"; }
      25%, 44% { content: "25%"; }
      45%, 64% { content: "50%"; }
      65%, 84% { content: "75%"; }
      85%, 100% { content: "100%"; }
    }

    @media (max-width: 560px) {
      .panel { padding: 24px 18px; }
      .cards { gap: 10px; padding: 18px 12px; }
      .card { width: 56px; height: 74px; }
      .progress-wrap { padding: 13px 14px 15px; }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Memory Mission loading screen">
    <section class="loader">
      <div class="topline">
        <span>Memory Mission</span>
        <span class="path">/recall/sequence</span>
      </div>

      <div class="panel">
        <div class="cards" aria-label="Memory card loading animation">
          <div class="card" style="--delay: 0s;">
            <div class="inner">
              <div class="face front"><span class="shape circle"></span></div>
              <div class="face back"></div>
            </div>
          </div>

          <div class="card" style="--delay: .56s;">
            <div class="inner">
              <div class="face front"><span class="shape square"></span></div>
              <div class="face back"></div>
            </div>
          </div>

          <div class="card" style="--delay: 1.12s;">
            <div class="inner">
              <div class="face front"><span class="shape triangle"></span></div>
              <div class="face back"></div>
            </div>
          </div>

          <div class="card" style="--delay: 1.68s;">
            <div class="inner">
              <div class="face front"><span class="shape star"></span></div>
              <div class="face back"></div>
            </div>
          </div>
        </div>

        <div class="status">
          <h1>Loading Memory Mission</h1>
          <p>retrieving recall sequence...</p>
        </div>

        <div class="progress-wrap" aria-label="Recall sequence loading progress">
          <div class="progress-meta">
            <span>Recall sequence</span>
            <span class="percent" aria-hidden="true"></span>
          </div>
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <p class="caption">A memory-card loader: symbols are briefly encoded, stored, then retrieved as a sequence.</p>
  </main>
</body>
</html>
